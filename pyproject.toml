[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-vault"
version = "0.1.0"
description = "Local-first, user-owned AI context vault"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Simon Heard"}]
dependencies = []

[project.scripts]
contextvault = "contextvault.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
