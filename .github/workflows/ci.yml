name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Test Python
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Test standalone extension core
        run: node tests/test_standalone.js
      - name: Check extension JavaScript
        run: |
          node --check extension/content.js
          node --check extension/providers.js
          node --check extension/background.js
          node --check extension/popup.js
          node --check src/contextvault/web/app.js
      - name: Validate extension manifest
        run: python -m json.tool extension/manifest.json >/dev/null
      - name: Package extension
        run: python scripts/package_extension.py
      - name: Package independent CLI wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist/cli
          python scripts/verify_cli_wheel.py dist/cli/context_vault-*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: contextvault-extension
          path: dist/contextvault-extension.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: contextvault-cli
          path: dist/cli/*.whl
          if-no-files-found: error
