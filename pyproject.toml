[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aimem"
version = "0.1.0"
description = "Local-first portable AI memory and context tools"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Simon Heard"}]
dependencies = []

[project.scripts]
aimem = "aimem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

