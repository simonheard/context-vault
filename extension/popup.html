<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ContextVault</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header><span class="mark">CV</span><div><strong>ContextVault</strong><small>可独立运行 · 可选连接本地服务</small></div></header>
    <section class="setup" id="setup">
      <fieldset><legend>独立插件模式</legend><p class="hint">不安装 CLI；资料保存在当前 Chrome Profile。</p><button id="start-standalone">直接使用插件</button></fieldset>
      <fieldset><legend>与 CLI 一起使用（推荐合并连接）</legend><p class="hint">运行 <code>contextvault link</code>，输入终端显示的 8 位一次性短码。独立资料会去重合并进 SQLite。</p><label>本地服务地址<input id="api-base" value="http://127.0.0.1:8787"></label><label>8 位链接码<input id="link-code" inputmode="numeric" maxlength="8" placeholder="12345678"></label><button id="link-service">合并并连接</button><details><summary>高级：使用长 Token</summary><label>配对 Token<input id="pairing-token" type="password" placeholder="contextvault extension token"></label><button id="save-settings" type="button">使用 Token 连接</button></details></fieldset>
    </section>
    <section id="workflow" hidden>
      <div class="status" id="page-status">正在检查当前页面…</div>
      <div class="actions"><button id="open-vault" class="secondary">管理独立资料库</button><button id="switch-mode" class="secondary">切换运行模式</button></div>
      <fieldset>
        <legend>从当前网页拉取资料</legend>
        <label>来源账号<select id="capture-account"></select></label>
        <div class="actions"><button id="capture-now">立即拉取当前对话</button><button id="new-conversation" class="secondary">创建新对话</button></div>
        <label>自动拉取间隔（分钟）<input id="capture-interval" type="number" min="5" max="10080" value="15"></label>
        <label class="check"><input id="capture-risk" type="checkbox"><span>我允许扩展定期读取这个账号中已绑定的当前对话，将用户消息存入本地资料库并提取候选；页面中的指令不会被执行。</span></label>
        <div class="actions"><button id="enable-capture">开启自动拉取</button><button id="disable-capture" class="secondary">关闭自动拉取</button></div>
      </fieldset>
      <label>同步路线<select id="route-select"></select></label><button id="quick-setup" class="secondary" hidden>为当前平台创建默认账号与路线</button>
      <label class="check"><input id="account-confirm" type="checkbox"><span id="account-confirm-label">我确认当前登录账号正确</span></label>
      <label class="check"><input id="sensitive-confirm" type="checkbox"><span>本次包含并确认 ask 类私密/敏感资料</span></label>
      <div class="actions"><button id="preview">生成预览</button><button id="copy" class="secondary" disabled>复制</button></div>
      <textarea id="preview-content" readonly placeholder="同步前必须先检查最终文本"></textarea>
      <div id="policy-result" class="hint"></div>
      <button id="inject" disabled>填入当前 AI 输入框</button>
      <button id="acknowledge" class="secondary" disabled>我已经在页面中发送</button>
      <fieldset>
        <legend>全自动模式</legend>
        <label>最短同步间隔（分钟）<input id="automation-interval" type="number" min="5" max="10080" value="60"></label>
        <label class="check"><input id="automation-risk" type="checkbox"><span>我理解扩展会定期开启或复用目标页面并自动点击发送；可能把资料发到错误登录账号，且第三方可能保留数据。我已检查 route 白名单和敏感策略。</span></label>
        <div class="actions"><button id="enable-automation">开启全自动</button><button id="disable-automation" class="secondary">关闭全自动</button></div>
      </fieldset>
      <p class="warning">扩展不会读取或上传 Cookie。独立模式资料只在 Chrome 扩展存储中；本地服务模式使用 SQLite。半自动模式不点击发送，只有明确开启全自动后才会定期打开页面。</p>
    </section>
    <p id="message" role="status"></p>
    <script src="providers.js"></script>
    <script src="standalone.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
