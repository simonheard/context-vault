[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-vault"
version = "0.7.0"
description = "Personal memory and profile synchronization across AI assistants"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Simon Heard"}]
dependencies = []

[project.scripts]
contextvault = "contextvault.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contextvault = ["web/*.html", "web/*.css", "web/*.js"]
